version: "3"

services:
  redis:
    image: docker.io/redis:7
    container_name: redis_db
    ports:
      - "6379:6379"
    restart: always

  django:
    build:
      context: . # Le contexte de construction est maintenant la racine du projet
      dockerfile: Dockerfile # Le Dockerfile se trouve à la racine
    container_name: django_app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./src/analyse:/app/analyse
      - ./src/db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=ABTheroMap.settings

  celery:
    build:
      context: . # Le contexte de construction est toujours la racine du projet
      dockerfile: Dockerfile # Le Dockerfile se trouve à la racine
    container_name: celery_worker
    command: celery -A ABTheroMap worker --loglevel=info
    volumes:
      - ./src/analyse:/app/analyse
      - ./src/db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
    depends_on:
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=ABTheroMap.settings

